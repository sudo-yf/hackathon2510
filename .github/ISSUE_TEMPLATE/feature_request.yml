name: Feature Request
description: 提交一个功能建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 当前遇到的问题或机会点
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 方案建议
      description: 建议实现方式、影响范围、成功标准
    validations:
      required: true
