name: Bug Report
description: 提交一个缺陷报告
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 请描述实际现象与预期行为
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 运行环境
      description: 系统版本、Python 版本、摄像头设备信息
