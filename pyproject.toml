[project]
name = "waytoagi-gesture-control"
version = "2.2.0"
description = "WayToAGI Hackathon project: real-time hand gesture control with Flask + MediaPipe"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0.0",
  "flask-socketio>=5.3.5",
  "flask-cors>=4.0.0",
  "opencv-python>=4.8.1.78",
  "mediapipe>=0.10.8",
  "numpy>=1.24.3",
  "pyautogui>=0.9.54",
  "python-engineio>=4.8.0",
  "python-socketio>=5.10.0",
  "psutil>=5.9.6",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "I"]
ignore = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
